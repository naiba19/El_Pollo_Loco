<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css">

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>

    <script src="models/status-bar.class.js"></script>
    <script src="models/bottle-bar.class.js"></script>
    <script src="models/coin-bar.class.js"></script>

    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>

    <script src="models/throwable-object.class.js"></script>

    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/endboss.class.js"></script>

    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
    <script src="models/fullscreen.js"></script>

    <style>
        @font-face {
            font-family: 'zabars';
            src: url('fonts/zabars.ttf') format('truetype');
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url(images/desert.png);
            background-position: center;
            font-family: 'zabars', Arial, Helvetica, sans-serif;
        }

        h1 {
            font-size: 64px;
            letter-spacing: 3px;
            font-family: 'zabars', Arial, Helvetica, sans-serif;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        canvas {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>El Pollo Loco</h1>
    <button id="fullscreen" onclick="fullscreen()">Fullscreen</button>
    <button id="start" onclick="startGame()">Start</button>
    <button id="restart" onclick="world.restart()" style="display:none;">Restart</button>
    <div id="canvas-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="start-screen"></div>
    </div>
    <div id="touch-controls">
        <button id="btn-left" class="touch-btn" oncontextmenu="return false">&#9664;</button>
        <button id="btn-right" class="touch-btn" oncontextmenu="return false">&#9654;</button>
        <button id="btn-jump" class="touch-btn" oncontextmenu="return false">&#10514;</button>
        <button id="btn-throw" class="touch-btn" oncontextmenu="return false">&#127870;</button>
    </div>
    <div id="rotate-overlay">
        <div class="rotate-icon">&#128260;</div>
        <p>Please rotate your device to landscape to play.</p>
    </div>
</body>

</html>
